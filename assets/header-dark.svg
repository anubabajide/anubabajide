<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Aanuoluwapo Babajide: learner, eater, engineer">
<style>
  .name { font: 800 64px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill: #e6edf3; letter-spacing: -1.5px; }
  .mono { font: 500 26px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; fill: #8b949e; }
  .prompt { fill: #2dd4bf; }
  .arrow { fill: #a78bfa; }
  .word { fill: #e6edf3; opacity: 0; animation: cycle 9s ease-in-out infinite; }
  .w0 { animation-delay: 0s; } .w1 { animation-delay: 3s; } .w2 { animation-delay: 6s; } 
  @keyframes cycle {
    0% { opacity: 0; }
    4.0% { opacity: 1; }
    29.33% { opacity: 1; }
    33.33%, 100% { opacity: 0; }
  }
  .cursor { fill: #2dd4bf; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .edges line { stroke: #30363d; stroke-width: 1.5; }
  .node { fill: #2dd4bf; animation: pulse 3.6s ease-in-out infinite; }
  .n1 { fill: #a78bfa; animation-delay: 1.2s; }
  .n2 { animation-delay: 2.4s; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .w2 { opacity: 1; }
  }
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#21262d"/>
  </pattern>
  <linearGradient id="bar" x1="0" x2="1">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#m)"/>
  <rect width="1200" height="5" fill="url(#bar)"/>
</g>
<rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text class="name" x="64" y="140">Aanuoluwapo Babajide</text>
<text class="mono" x="64" y="204"><tspan class="prompt">$</tspan> whoami</text>
<text class="mono word w0" x="64" y="250"><tspan class="arrow">→</tspan> learner.<tspan class="cursor">_</tspan></text><text class="mono word w1" x="64" y="250"><tspan class="arrow">→</tspan> eater.<tspan class="cursor">_</tspan></text><text class="mono word w2" x="64" y="250"><tspan class="arrow">→</tspan> engineer.<tspan class="cursor">_</tspan></text>
<g class="edges"><line x1="930" y1="90" x2="1010" y2="150"/><line x1="1010" y1="150" x2="1090" y2="80"/><line x1="1010" y1="150" x2="1120" y2="200"/><line x1="1010" y1="150" x2="980" y2="240"/><line x1="980" y1="240" x2="1060" y2="260"/><line x1="1120" y1="200" x2="1060" y2="260"/><line x1="1090" y1="80" x2="1120" y2="200"/></g>
<circle class="node n0" cx="930" cy="90" r="5"/><circle class="node n1" cx="1010" cy="150" r="7"/><circle class="node n2" cx="1090" cy="80" r="5"/><circle class="node n0" cx="1120" cy="200" r="5"/><circle class="node n1" cx="980" cy="240" r="5"/><circle class="node n2" cx="1060" cy="260" r="5"/>
</svg>
